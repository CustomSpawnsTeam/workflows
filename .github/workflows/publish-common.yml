name: Common Publish

on:
  workflow_call:
    inputs:
      mod_id:
        required: true
        type: string
      workshop_id:
        required: true
        type: number
      nexusmods_mod_id:
        required: false
        type: string
        default: ""
      # Found from the mod's files on Nexus when empty: the newest file whose name starts with mod_id
      nexusmods_file_group_id:
        required: false
        type: string
        default: ""
      # Mod managers download the primary file, so only one file of a mod page should take it
      nexusmods_primary_download:
        required: false
        type: boolean
        default: true
      # A module of the same org, e.g. CustomSpawns, built into the Nexus archive next to this one
      bundle_mod_id:
        required: false
        type: string
        default: ""
      # Defaults to the release tag of the version this module's SubModule.xml depends on
      bundle_ref:
        required: false
        type: string
        default: ""
    secrets:
      STEAM_WORKSHOP_LOGIN:
        required: true
      STEAM_WORKSHOP_PASSWORD:
        required: true
      STEAM_WORKSHOP_AUTH_CODE:
        required: true
      NEXUSMODS_APIKEY:
        required: false

jobs:
  build-module:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.changelog.outputs.mod_version }}
      mod_description: ${{ steps.changelog.outputs.mod_description }}
      mod_filename: ${{ steps.filename.outputs.mod_filename }}
    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x
    - name: Build
      run: |
        artifact=$(pwd)/bannerlord
        mkdir -p $artifact;
        proj="${{ inputs.mod_id }}/${{ inputs.mod_id }}.csproj";
        dotnet clean $proj --configuration Release;
        dotnet build $proj --configuration Release -p:GameFolder="$artifact";

    - name: Install Bannerlord.ChangelogParser
      run: dotnet tool install -g Bannerlord.ChangelogParser;
      shell: pwsh

    - name: Run ChangelogParser
      id: changelog
      run: |
        vers="$(bannerlord_changelog_parser latestversion -f "$PWD/changelog.txt")"
        desc="$(bannerlord_changelog_parser fulldescription -f "$PWD/changelog.txt")"
        # A random delimiter, so no line of the description can end the value early
        eof="EOF_$(openssl rand -hex 16)"
        {
          echo "mod_version=$vers"
          echo "mod_description<<$eof"
          echo "${desc//$'\r'/}"
          echo "$eof"
        } >> "$GITHUB_OUTPUT"

    # Names the release like "CustomSpawns 2.3.0 - For Bannerlord v1.5.7" or "... v1.4.7 and v1.4.8"
    - name: Name the release file
      id: filename
      env:
        MOD_ID: ${{ inputs.mod_id }}
        MOD_VERSION: ${{ steps.changelog.outputs.mod_version }}
      run: |
        mapfile -t versions < <(tr -d '\r' < supported-game-versions.txt | grep . | sort -V)
        games="${versions[-1]}"
        if [ ${#versions[@]} -gt 1 ]
        then
          first=("${versions[@]:0:${#versions[@]}-1}")
          games="$(IFS=,; echo "${first[*]}" | sed 's/,/, /g') and $games"
        fi
        echo "mod_filename=$MOD_ID $MOD_VERSION - For Bannerlord $games" >> "$GITHUB_OUTPUT"

    - name: Upload bannerlord folder
      uses: actions/upload-artifact@v4
      with:
        name: bannerlord
        path: ./bannerlord

    - name: Find the bundled module's release
      id: bundle_ref
      if: inputs.bundle_mod_id != ''
      env:
        BUNDLE_MOD_ID: ${{ inputs.bundle_mod_id }}
        BUNDLE_REF: ${{ inputs.bundle_ref }}
      run: |
        ref="$BUNDLE_REF"
        if [ -z "$ref" ]
        then
          ref="$(grep -o "DependedModule Id=\"$BUNDLE_MOD_ID\" DependentVersion=\"[^\"]*" SubModule.xml | sed 's/.*DependentVersion="//')"
        fi
        if [ -z "$ref" ]; then echo "::error::SubModule.xml doesn't depend on $BUNDLE_MOD_ID"; exit 1; fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Checkout bundled module
      if: inputs.bundle_mod_id != ''
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.bundle_mod_id }}
        ref: ${{ steps.bundle_ref.outputs.ref }}
        path: bundle-source

    - name: Build Nexus bundle
      if: inputs.bundle_mod_id != ''
      run: |
        bundle=$(pwd)/nexus-bundle
        mkdir -p $bundle;
        cp -r ./bannerlord/. $bundle/;
        proj="bundle-source/${{ inputs.bundle_mod_id }}/${{ inputs.bundle_mod_id }}.csproj";
        dotnet build $proj --configuration Release -p:GameFolder="$bundle";

    - name: Upload Nexus bundle
      if: inputs.bundle_mod_id != ''
      uses: actions/upload-artifact@v4
      with:
        name: nexus-bundle
        path: ./nexus-bundle

  ###########################
  #         GITHUB          #
  ###########################
  publish-on-github:
    needs: ["build-module"]
    uses: BUTR/workflows/.github/workflows/release-github.yml@master
    with:
      mod_id: ${{ inputs.mod_id }}
      mod_version: ${{ needs.build-module.outputs.mod_version }}
      mod_description: ${{ needs.build-module.outputs.mod_description }}
      artifact_name: bannerlord

  ###########################
  #          STEAM          #
  ###########################
  publish-on-steam:
    needs: ["build-module"]
    uses: BUTR/workflows/.github/workflows/release-steam.yml@master
    with:
      workshop_id: ${{ inputs.workshop_id }}
      mod_id: ${{ inputs.mod_id }}
      mod_description: ${{ needs.build-module.outputs.mod_description }}
      artifact_name: bannerlord
    secrets:
      STEAM_LOGIN: ${{ secrets.STEAM_WORKSHOP_LOGIN }}
      STEAM_PASSWORD: ${{ secrets.STEAM_WORKSHOP_PASSWORD }}
      STEAM_AUTH_CODE: ${{ secrets.STEAM_WORKSHOP_AUTH_CODE }}

  ###########################
  #        NEXUSMODS        #
  ###########################
  # A file group keeps one Nexus file across its versions, unlike the id of each uploaded version
  find-nexusmods-file-group:
    if: inputs.nexusmods_mod_id != ''
    runs-on: ubuntu-latest
    outputs:
      file_group_id: ${{ steps.find.outputs.file_group_id }}
    steps:
    - name: Find the file group
      id: find
      env:
        NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
        FILE_GROUP_ID: ${{ inputs.nexusmods_file_group_id }}
        MOD_ID: ${{ inputs.mod_id }}
        API: https://api.nexusmods.com
        GAME: mountandblade2bannerlord
        NEXUS_MOD: ${{ inputs.nexusmods_mod_id }}
      run: |
        group="$FILE_GROUP_ID"
        if [ -z "$group" ]
        then
          prefix="$(echo "$MOD_ID" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')"
          file="$(curl -sSf -H "apikey: $NEXUSMODS_APIKEY" "$API/v1/games/$GAME/mods/$NEXUS_MOD/files.json" \
            | jq -r --arg p "$prefix" '[.files[] | select(.name | ascii_downcase | gsub("[^a-z0-9]"; "") | startswith($p))]
                | sort_by(.uploaded_timestamp) | last | .file_id // empty')"
          if [ -z "$file" ]; then echo "::error::No Nexus file of mod $NEXUS_MOD is named after $MOD_ID"; exit 1; fi
          group="$(curl -sSf -H "apikey: $NEXUSMODS_APIKEY" "$API/v3/games/$GAME/mod-file-versions/$file" | jq -r '.data.file.id // empty')"
          if [ -z "$group" ]; then echo "::error::No file group found for Nexus file $file"; exit 1; fi
        fi
        echo "file_group_id=$group" >> "$GITHUB_OUTPUT"

  publish-on-nexusmods:
    if: inputs.nexusmods_mod_id != ''
    needs: ["build-module", "find-nexusmods-file-group"]
    uses: BUTR/workflows/.github/workflows/release-nexusmods.yml@master
    with:
      nexusmods_game_id: mountandblade2bannerlord
      nexusmods_mod_id: ${{ inputs.nexusmods_mod_id }}
      nexusmods_file_group_id: ${{ needs.find-nexusmods-file-group.outputs.file_group_id }}
      mod_filename: ${{ needs.build-module.outputs.mod_filename }}
      mod_version: ${{ needs.build-module.outputs.mod_version }}
      mod_description: ${{ needs.build-module.outputs.mod_description }}
      artifact_name: ${{ inputs.bundle_mod_id != '' && 'nexus-bundle' || 'bannerlord' }}
      primary_mod_manager_download: ${{ inputs.nexusmods_primary_download }}
      # The mod page shows the version of its primary file
      update_mod_version: ${{ inputs.nexusmods_primary_download }}
    secrets:
      NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
